<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mi Recibo Petrolero</title>
<meta name="description" content="Estimación del sueldo neto para el CCT 784/21. Tus datos quedan solo en tu dispositivo.">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#F8FAFB">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#112830">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mi Recibo">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
@font-face{font-family:"Barlow Condensed";font-style:normal;font-weight:600;font-display:swap;src:url(barlow-condensed-600.woff2) format("woff2")}
@font-face{font-family:"Barlow Condensed";font-style:normal;font-weight:700;font-display:swap;src:url(barlow-condensed-700.woff2) format("woff2")}
@font-face{font-family:"Barlow";font-style:normal;font-weight:400;font-display:swap;src:url(barlow-400.woff2) format("woff2")}
@font-face{font-family:"Barlow";font-style:normal;font-weight:500;font-display:swap;src:url(barlow-500.woff2) format("woff2")}
@font-face{font-family:"Barlow";font-style:normal;font-weight:600;font-display:swap;src:url(barlow-600.woff2) format("woff2")}
@font-face{font-family:"IBM Plex Mono";font-style:normal;font-weight:400;font-display:swap;src:url(ibm-plex-mono-400.woff2) format("woff2")}
@font-face{font-family:"IBM Plex Mono";font-style:normal;font-weight:500;font-display:swap;src:url(ibm-plex-mono-500.woff2) format("woff2")}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
/* Concepto: indicador de campo. Una columna en el celular, lectura grande arriba, teclas abajo. Lo único fuerte es el display del neto. */
:root{
  --bg:#E8EDEF; --surface:#F8FAFB; --ink:#0F252D; --muted:#51666E; --line:#CBD6DA;
  --panel:#0C3540; --panel-ink:#E8F4F2; --panel-muted:#A5C4C6; --signal:#FFB83D;
  --accent:#9C4500; --input:#FFF5D9; --input-line:#DCC27A;
  --ok:#14684A; --ok-bg:#DCEFE6; --bad:#AE2318; --bad-bg:#F8E1DE; --warn-bg:#FBEFD2; --warn:#7A5200;
  --rem:#2A8094; --nr:#E3A32B;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --data:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A1A20; --surface:#112830; --ink:#E4EFEF; --muted:#97ADB3; --line:#274550;
  --panel:#0D3A46; --panel-ink:#E8F4F2; --panel-muted:#A5C4C6; --signal:#FFC257;
  --accent:#FFAD5C; --input:#2D2A17; --input-line:#6B5D2A;
  --ok:#6FD3A6; --ok-bg:#12382B; --bad:#FF9A8F; --bad-bg:#43201C; --warn-bg:#3A2F12; --warn:#F2CE7A;
  --rem:#4FAFC4; --nr:#EDB64B; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0A1A20; --surface:#112830; --ink:#E4EFEF; --muted:#97ADB3; --line:#274550;
  --panel:#0D3A46; --panel-ink:#E8F4F2; --panel-muted:#A5C4C6; --signal:#FFC257;
  --accent:#FFAD5C; --input:#2D2A17; --input-line:#6B5D2A;
  --ok:#6FD3A6; --ok-bg:#12382B; --bad:#FF9A8F; --bad-bg:#43201C; --warn-bg:#3A2F12; --warn:#F2CE7A;
  --rem:#4FAFC4; --nr:#EDB64B; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.4}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:600;margin:0;text-wrap:balance}

#top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
#top .inner{max-width:1120px;margin-inline:auto;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px}
.marca{display:flex;align-items:baseline;gap:10px;min-width:0;flex:1 1 180px}
.marca h1{font-size:1.3rem;letter-spacing:.01em;white-space:nowrap}
.ficha{font-family:var(--data);font-size:.72rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.guardado{font-size:.75rem;color:var(--muted);margin-left:auto;white-space:nowrap}
.guardado.error{color:var(--bad);font-weight:600}
.selector{display:flex;align-items:center;gap:6px;flex:1 1 300px;min-width:0}
body[data-tab="meses"] .selector,body[data-tab="aumentos"] .selector{display:none}
.selector button{width:42px;height:42px;border:1px solid var(--line);background:var(--bg);border-radius:8px;font-size:1.3rem;line-height:1;flex:none}
.selector select{height:42px;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:0 8px;font-family:var(--display);font-weight:600;font-size:1.15rem;min-width:0;flex:0 1 118px}
.mini{margin-left:auto;text-align:right;font-family:var(--display);font-weight:600;font-size:1.2rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.mini small{display:block;font-family:var(--body);font-weight:500;font-size:.68rem;color:var(--muted);line-height:1.1;letter-spacing:.04em;text-transform:uppercase}

#aviso:empty{display:none}
#aviso{max-width:1120px;margin:12px auto 0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#aviso p{margin:0;padding:10px 12px;background:var(--warn-bg);color:var(--warn);border-radius:8px;font-size:.92rem}

#paneles{display:grid;gap:20px;max-width:640px;margin-inline:auto;padding-block:16px 104px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.pane{display:none;min-width:0}
body[data-tab="recibo"] #p-recibo,body[data-tab="cargar"] #p-cargar,body[data-tab="meses"] #p-meses,body[data-tab="aumentos"] #p-aumentos{display:block}
@media (min-width:980px){
  #paneles{max-width:1120px}
  body[data-tab="recibo"] #paneles,body[data-tab="cargar"] #paneles{grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);align-items:start}
  body[data-tab="recibo"] #p-cargar,body[data-tab="cargar"] #p-recibo{display:block}
  body[data-tab="recibo"] #top .mini,body[data-tab="cargar"] #top .mini{display:none}
}
body[data-tab="recibo"] .mini{display:none}

/* display del neto */
.lectura{background:var(--panel);color:var(--panel-ink);border-radius:14px;padding:16px 18px 14px;display:grid;gap:10px}
.lect-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.tag{font-family:var(--display);font-weight:600;letter-spacing:.14em;font-size:.95rem;color:var(--panel-muted)}
.monto{font-family:var(--display);font-weight:700;color:var(--signal);font-size:clamp(2.4rem,12vw,4.4rem);line-height:1;font-variant-numeric:tabular-nums;letter-spacing:.005em;white-space:nowrap}
.monto .dec{font-size:.5em;font-weight:600}
.monto .sig{font-size:.55em;font-weight:600;margin-right:.12em;color:var(--panel-muted)}
.sub{font-size:.88rem;color:var(--panel-muted);display:flex;flex-wrap:wrap;gap:2px 14px}
.sub b{color:var(--panel-ink);font-weight:600}
.barra{display:flex;height:10px;border-radius:3px;overflow:hidden;background:rgba(255,255,255,.12);gap:2px}
.barra i{display:block;height:100%}
.barra .r{background:var(--rem)}.barra .n{background:var(--nr)}
.tres{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:0}
.tres dt{font-size:.74rem;color:var(--panel-muted);display:flex;align-items:center;gap:5px}
.tres dt i{width:9px;height:9px;border-radius:2px;display:inline-block;flex:none}
.tres dd{margin:0;font-family:var(--display);font-weight:600;font-size:1.22rem;font-variant-numeric:tabular-nums}

.pill{font-size:.74rem;font-weight:600;padding:2px 8px;border-radius:99px;white-space:nowrap;background:var(--bg);color:var(--muted)}
.pill.real{background:var(--ok-bg);color:var(--ok)}
.pill.est{background:var(--warn-bg);color:var(--warn)}
.lectura .pill{background:rgba(255,255,255,.12);color:var(--panel-ink)}
.lectura .pill.real{background:#BFE8D3;color:#0C4A34}
.lectura .pill.est{background:var(--signal);color:#3A2600}

.nota{margin:12px 0 0;padding:10px 12px;border-radius:8px;font-size:.92rem;background:var(--surface);border:1px solid var(--line);display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px}
.nota.ok{background:var(--ok-bg);border-color:transparent;color:var(--ok)}
.nota.mal{background:var(--bad-bg);border-color:transparent;color:var(--bad)}
.btn{border:1px solid var(--accent);background:transparent;color:var(--accent);border-radius:8px;padding:8px 12px;font-weight:600;min-height:40px}
.btn.lleno{background:var(--accent);color:var(--surface)}

.grupo{margin-top:18px}
.grupo h2{display:flex;justify-content:space-between;gap:12px;align-items:baseline;font-size:1.12rem;letter-spacing:.03em;padding-bottom:4px;border-bottom:2px solid var(--ink)}
.grupo h2 span{font-variant-numeric:tabular-nums}
.lineas{list-style:none;margin:0;padding:0}
.lineas li{display:grid;grid-template-columns:62px minmax(0,1fr) auto;gap:2px 8px;align-items:baseline;padding:7px 0;border-bottom:1px solid var(--line)}
.cod{font-family:var(--data);font-size:.72rem;color:var(--muted)}
.con{min-width:0;font-size:.95rem}
.con small{display:block;font-family:var(--data);font-size:.72rem;color:var(--muted);overflow-wrap:anywhere}
.imp{font-family:var(--data);font-size:.88rem;font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
details.plegable{margin-top:16px;border-top:1px solid var(--line);padding-top:10px}
details.plegable>summary{cursor:pointer;font-weight:600;min-height:32px}

/* formularios */
.bloque{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px;min-width:0}
.bloque>h2{font-size:1.15rem;letter-spacing:.03em;margin-bottom:2px}
.bloque>p.ayuda,.ayuda{margin:0 0 8px;color:var(--muted);font-size:.86rem}
.campo{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,160px);align-items:center;gap:10px;padding:7px 0;border-top:1px solid var(--line)}
.campo label{min-width:0;font-size:.95rem}
.campo label small{display:block;font-family:var(--data);font-size:.7rem;color:var(--muted)}
input.dato,select.dato{width:100%;height:42px;background:var(--input);border:1px solid var(--input-line);border-radius:7px;padding:0 8px;font-family:var(--data);font-size:.95rem;text-align:right;font-variant-numeric:tabular-nums;min-width:0}
select.dato{text-align:left;font-family:var(--body)}
input.dato::placeholder{color:var(--muted);opacity:.85}
.paso{display:grid;grid-template-columns:40px minmax(0,1fr) 40px;gap:4px}
.paso button{height:42px;border:1px solid var(--line);background:var(--bg);border-radius:7px;font-size:1.15rem;line-height:1}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:2px;background:var(--bg);padding:3px;border-radius:9px;margin:8px 0}
.seg button{border:0;background:transparent;border-radius:7px;min-height:38px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
.copiar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;margin-top:8px}

.grilla{overflow-x:auto;max-height:64vh;overflow-y:auto;border:1px solid var(--line);border-radius:8px}
.grilla table{border-collapse:separate;border-spacing:0;font-size:.82rem}
.grilla th,.grilla td{padding:2px;border-bottom:1px solid var(--line);background:var(--surface)}
.grilla thead th{position:sticky;top:0;z-index:2;font-family:var(--display);font-weight:600;font-size:.82rem;line-height:1.05;min-width:56px;padding:6px 3px}
.grilla thead tr+tr th{top:40px;font-family:var(--data);font-weight:500;background:var(--bg)}
.grilla .dia{position:sticky;left:0;z-index:1;text-align:left;font-family:var(--data);font-weight:400;font-size:.74rem;white-space:nowrap;padding:0 8px;min-width:88px}
.grilla thead .dia{z-index:3}
.grilla tr.finde .dia{color:var(--accent);font-weight:500}
.grilla input{width:52px;height:34px;background:var(--input);border:1px solid var(--input-line);border-radius:5px;text-align:right;padding:0 4px;font-family:var(--data);font-size:.82rem}

/* meses */
.filas{display:grid;gap:2px;margin-top:10px}
.fila{display:grid;grid-template-columns:62px minmax(0,1fr) 88px;gap:8px;align-items:center;width:100%;background:transparent;border:0;border-bottom:1px solid var(--line);padding:9px 0;text-align:left}
.fila .m{font-family:var(--display);font-weight:600;font-size:1.05rem;white-space:nowrap}
.fila .pista{display:block;height:14px;background:var(--bg);border-radius:3px;overflow:hidden}
.fila .pista i{display:block;height:100%;background:var(--rem)}
.fila .pista i.est{background:var(--nr)}
.fila .pista i.fijo{background:var(--line)}
.fila .v{font-family:var(--data);font-size:.82rem;text-align:right;font-variant-numeric:tabular-nums}
.fila.activa .m{color:var(--accent)}
.leyenda{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.8rem;color:var(--muted);margin-top:6px}
.leyenda i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px}

/* aumentos */
.tabla{overflow-x:auto;margin-top:6px}
.tabla table{border-collapse:collapse;font-size:.86rem;width:100%}
.tabla th{font-family:var(--display);font-weight:600;font-size:.86rem;text-align:right;padding:5px 6px;border-bottom:2px solid var(--ink);white-space:nowrap}
.tabla th:first-child,.tabla td:first-child{text-align:left}
.tabla td{padding:3px 6px;border-bottom:1px solid var(--line);font-family:var(--data);font-size:.8rem;text-align:right;white-space:nowrap}
.tabla td.txt{font-family:var(--body);font-size:.86rem;white-space:normal;min-width:130px}
.tabla td.nota-c{font-family:var(--body);text-align:left;color:var(--muted);min-width:170px;white-space:normal}
.tabla input.dato,.tabla select.dato{height:34px;font-size:.8rem;padding:0 5px;min-width:74px}
.tabla select.dato{min-width:104px}
.tabla tr.sel td{background:var(--ok-bg)}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 10px;margin-top:6px}
.form label{font-size:.84rem;color:var(--muted);display:grid;gap:3px;min-width:0}
.form .ancho{grid-column:1/-1}
.txtlargo p{margin:0 0 8px;font-size:.93rem;max-width:65ch}
.txtlargo h3{font-size:1.05rem;margin:12px 0 4px}

#tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
#tabs .inner{display:grid;grid-template-columns:repeat(4,1fr);max-width:640px;margin-inline:auto}
#tabs button{border:0;background:transparent;min-height:56px;font-family:var(--display);font-weight:600;font-size:1rem;letter-spacing:.06em;color:var(--muted);border-top:3px solid transparent}
#tabs button[aria-current="page"]{color:var(--accent);border-top-color:var(--accent)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(70px + env(safe-area-inset-bottom,0px));z-index:7;background:var(--ink);color:var(--surface);border-radius:8px;padding:9px 12px;font-size:.9rem;display:none;gap:12px;align-items:center;max-width:calc(100vw - 32px)}
#toast.ver{display:flex}
#toast button{border:0;background:transparent;color:inherit;text-decoration:underline;font-weight:600}
@media (prefers-reduced-motion:no-preference){.barra i,.fila .pista i{transition:width .25s ease}}
.acciones{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
</style>
</head>
<body>
<header id="top"><div class="inner">
  <div class="marca"><h1>Mi Recibo</h1><span class="ficha" id="ficha">CCT 784/21</span><span class="guardado" id="guardado"></span></div>
  <div class="selector">
    <button id="prev" type="button" aria-label="Mes anterior">‹</button>
    <select id="mes" aria-label="Mes de liquidación"></select>
    <button id="next" type="button" aria-label="Mes siguiente">›</button>
    <div class="mini" id="mini"></div>
  </div>
</div></header>
<div id="aviso"></div>
<main id="paneles">
  <section class="pane" id="p-recibo" aria-label="Recibo">
    <div class="lectura">
      <div class="lect-top"><span class="tag">SUELDO NETO</span></div>
      <div class="monto">—</div>
      <div class="sub">Abriendo la app. Acá vas a ver el neto del mes y cada renglón del recibo.</div>
    </div>
  </section>
  <section class="pane" id="p-cargar" aria-label="Cargar"></section>
  <section class="pane" id="p-meses" aria-label="Meses"></section>
  <section class="pane" id="p-aumentos" aria-label="Aumentos"></section>
</main>
<nav id="tabs" aria-label="Secciones"><div class="inner">
  <button type="button" data-tab="recibo">RECIBO</button>
  <button type="button" data-tab="cargar">CARGAR</button>
  <button type="button" data-tab="meses">MESES</button>
  <button type="button" data-tab="aumentos">AUMENTOS</button>
</div></nav>
<div id="toast" role="status" aria-live="polite"></div>
<input type="file" id="copia-archivo" hidden aria-label="Elegir copia">

function aNum(t){
  let s=String(t).trim().replace(/\s|\$/g,"");
  if(s==="")return NaN;
  if(s.includes(",")){s=s.replace(/\./g,"").replace(",",".")}
  else if(/^-?\d{1,3}(\.\d{3})+$/.test(s)){s=s.replace(/\./g,"")}
  return Number(s);
}

function mesInicial(){
  const h=new Date();let y=h.getFullYear(),m=h.getMonth()+1;
  if(h.getDate()<21){m--;if(m<1){m=12;y--}}
  const id=idMes(y,m);
  return S.lista.some(x=>x.id===id)?id:S.lista[0].id;
}
function ctx(){return {perfil:S.perfil,meses:S.meses,lista:S.lista}}
function resActual(){return S.res[S.mes]}
function mesPrevio(id){const i=S.lista.findIndex(x=>x.id===id);return i>0?S.lista[i-1].id:null}
function estado(r){return r.real>0?["real","Recibo real"]:r.hay?["est","Estimado"]:["","Solo parte fija"]}
function periodo(y,m){const py=m===1?y-1:y,pm=m===1?12:m-1;return {desde:{y:py,m:pm},hasta:{y,m}}}
function diasPeriodo(y,m){
  const p=periodo(y,m),out=[];let t=Date.UTC(p.desde.y,p.desde.m-1,21);const fin=Date.UTC(y,m-1,20);
  while(t<=fin){const D=new Date(t);out.push({iso:D.toISOString().slice(0,10),d:D.getUTCDate(),m:D.getUTCMonth()+1,w:D.getUTCDay()});t+=864e5}
  return out;
}

/* ---------- copia de seguridad ---------- */
const hoyISO=()=>new Date().toISOString().slice(0,10);
function descargar(blob,nombre){
  const a=document.createElement("a"),u=URL.createObjectURL(blob);
  a.href=u;a.download=nombre;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(u),4000);
}
async function guardarCopia(){
  const nombre=`mi-recibo-copia-${hoyISO()}.json`;
  const texto=JSON.stringify({app:"mi-recibo-petrolero",version:1,fecha:new Date().toISOString(),perfil:S.perfil,meses:S.meses},null,1);
  const blob=new Blob([texto],{type:"application/json"}),arch=new File([blob],nombre,{type:"application/json"});
  let hecho=false;
  if(navigator.canShare&&navigator.canShare({files:[arch]})){
    try{await navigator.share({files:[arch],title:"Copia de Mi Recibo"});hecho=true}
    catch(e){if(e&&e.name==="AbortError")return}
  }
  if(!hecho)descargar(blob,nombre);
  try{localStorage.setItem(CLAVE_COPIA,hoyISO())}catch(e){}
  dibujarMeses();avisar("Copia lista. Guardala en un lugar seguro.");
}
const esObjeto=x=>!!x&&typeof x==="object"&&!Array.isArray(x);
async function recuperarCopia(archivo){
  let d=null;
  try{d=JSON.parse(await archivo.text())}catch(e){}
  if(!esObjeto(d)||d.app!=="mi-recibo-petrolero"||!esObjeto(d.perfil)||!esObjeto(d.meses)||!Object.values(d.meses).every(esObjeto)){
    avisar("Ese archivo no es una copia de Mi Recibo.");return;
  }
  const antes={perfil:clon(S.perfil),meses:clon(S.meses)};
  S.perfil=d.perfil;S.meses=d.meses;guardarLocal();dibujarTodo();
  avisar("Copia recuperada.",()=>{S.perfil=antes.perfil;S.meses=antes.meses;guardarLocal();dibujarTodo()});
}

  const claves=[[pre+r.cat,"Básico "+r.cat],[pre+r.catmf,"Básico "+r.catmf],["ANT","Antigüedad por año"],["PAZ","Bono Paz Social"],["YAC","Adicional Yacimiento"],["GUA","Guardia pasiva"],["V8","Vianda 8 hs"],["VC","Vianda complementaria"],["VIA","Hora de viaje"],["AVC","AVC (supuesto)"],["ASIG","Asig. cuenca (supuesto)"]];
  const filasVal=claves.map(([k,l])=>`<tr><td class="txt">${esc(l)}</td>${ts.map(t=>{
    const ed=esCustom(t)||k==="AVC"||k==="ASIG",v=valor(S.perfil,t,k);
    return ed?`<td><input class="dato" id="ov-${esc(t)}-${k}" data-ot="${esc(t)}" data-ok="${k}" inputmode="decimal" aria-label="${esc(l)} ${esc(t)}" value="${$0(v)}"></td>`:`<td>${$0(v)}</td>`;
  }).join("")}</tr>`).join("");
  const custom=(S.perfil.tablas||[]);
  const parametros=[["jub","Jubilación"],["ley","Ley 19032"],["os","Obra social"],["sin","Cuota sindical"],["mut","Mutual"],["pres","Presentismo"]];
  const sigId=S.lista.find(m=>m.y*12+m.m>2027*12+4)||S.lista[S.lista.length-1];
  p.innerHTML=`
  <div class="bloque"><h2>Agregar un aumento</h2>
    <p class="ayuda">Crea una tabla nueva sobre la anterior. Después podés corregir cada valor con la tabla oficial. Lo que cambies en esta pantalla queda solo para vos.</p>
    <div class="form">
      <label>Nombre<input class="dato" id="nu-nom" autocomplete="off" style="text-align:left" placeholder="Jul-27"></label>
      <label>% de aumento<input class="dato" id="nu-pct" inputmode="decimal" autocomplete="off" placeholder="5"></label>
      <label class="ancho">Rige desde<select class="dato" id="nu-des">${S.lista.map(m=>`<option${m.id===sigId.id?" selected":""}>${m.id}</option>`).join("")}</select></label>
      <div class="ancho"><button class="btn lleno" type="button" id="nu-ok">Agregar aumento</button></div>
    </div>
    ${custom.length?`<div class="tabla"><table><tbody>${custom.map(t=>`<tr><td class="txt">${esc(t.id)}: ${$q(num(t.pct)*100)}% sobre ${esc(t.base)}</td><td><button class="btn" type="button" data-quitar="${esc(t.id)}">Quitar</button></td></tr>`).join("")}</tbody></table></div>`:""}
  </div>
  <div class="bloque"><h2>Qué rige cada mes</h2>
    <p class="ayuda">Suma NR es el coeficiente sobre el mes en curso. Tope es la base máxima de ANSES, editala si cambió. Feriados de lunes a viernes, para la vianda Ha 5023. La pauta prevé una revisión en la segunda quincena de noviembre de 2026.</p>
    <div class="tabla"><table><thead><tr><th>Mes</th><th>Tabla</th><th>Suma NR</th><th>Tope</th><th>Feriados</th><th style="text-align:left">Qué se paga</th></tr></thead><tbody>${filasPauta}</tbody></table></div>
  </div>
  <div class="bloque"><h2>Valores por tabla</h2>
    <p class="ayuda">En amarillo lo que podés corregir. AVC y Asignación cuenca no figuran en la tabla oficial: suben con la pauta como supuesto. Confirmalo con el recibo de octubre.</p>
    <div class="tabla"><table><thead><tr><th>Concepto</th>${ts.map(t=>`<th>${esc(t)}</th>`).join("")}</tr></thead><tbody>${filasVal}</tbody></table></div>
    <details class="plegable"><summary>Tabla completa de básicos, ${zn}</summary>
      <div class="tabla"><table><thead><tr><th>Cat.</th>${DATOS.tablas.map(t=>`<th>${t}</th>`).join("")}</tr></thead><tbody>${DATOS.cats.map(c=>`<tr class="${c===r.cat?"sel":""}"><td class="txt">${c}</td>${DATOS.val[pre+c].map(v=>`<td>${$0(v)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>
    </details>
    <details class="plegable"><summary>Otros adicionales de la tabla</summary>
      <div class="tabla"><table><thead><tr><th>Concepto</th>${DATOS.tablas.map(t=>`<th>${t}</th>`).join("")}</tr></thead><tbody>${DATOS.ref.map(x=>`<tr><td class="txt">${esc(x[0])}</td>${x[1].map(v=>`<td>${$0(v)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>
    </details>
  </div>
  <div class="bloque"><h2>Tus datos fijos</h2>
    <div class="campo"><label for="par-ing">Fecha de ingreso</label><input class="dato" id="par-ing" type="date" value="${esc(S.perfil.ingreso||"")}"></div>
    <div class="campo"><label for="par-zona">Zona</label><select class="dato" id="par-zona">${Object.entries(ZONAS).map(([k,z])=>`<option value="${k}"${(S.perfil.zonaId==="ZA"?"ZA":"Z1")===k?" selected":""}>${z.n}</option>`).join("")}</select></div>
    ${parametros.map(([k,l])=>`<div class="campo"><label for="par-${k}">${l} (%)</label><input class="dato" id="par-${k}" data-par="${k}" inputmode="decimal" value="${String(+(P[k]*100).toFixed(4)).replace(".",",")}"></div>`).join("")}
  </div>
  <div class="bloque txtlargo"><h2>Cómo calcula</h2>
    <p>Sueldo base: Básico + Mayor Función + Antigüedad + Guardias + Acta Acuerdo + Yacimiento.</p>
    <p>Hora normal: sueldo base / 180. Al 50% multiplica por 1,5 y al 100% por 2. Manejo se paga como 50%.</p>
    <p>Presentismo: 6% de sueldo base + horas.</p>
    <p>Suma no remunerativa: coeficiente × (remunerativo + viandas + AVC + Asignación cuenca).</p>
    <p>Jubilación y Ley 19032 van sobre remunerativo. Obra social, sindical y mutual van sobre remunerativo + Asignación cuenca. Jubilación, Ley 19032 y obra social tienen tope de ANSES.</p>
    <h3>Probado</h3><p>Se comparó con 4 recibos reales de junio a septiembre de 2026, categorías I-B y L-B en Zona 1: dieron al centavo, renglón por renglón. Otras categorías y zonas usan la misma lógica, pero no se compararon con un recibo.</p>
    <h3>Sin probar</h3>
    <p>AVC y Asignación cuenca suben con la pauta. Horas 50% PT suma a Ha 2550. Viaje y Viaje PT se pagan a valor art. 59 con presentismo. Vianda comedor y extra van a Ha 5010. El tope de obra social se aplica sobre remunerativo + Asignación cuenca. El plus vacacional sin valor cargado se estima con el promedio remunerativo de hasta 6 meses.</p>
    <p>Si tu recibo trae otros conceptos, como Disponibilidad, Torre o Choferes, cargalos en Otro remunerativo. Pueden cambiar el valor hora, así que el resultado es menos exacto.</p>
    <h3>No incluye</h3><p>Ganancias y aguinaldo. Si te retienen Ganancias, cargala a mano. Compará siempre con tu recibo real cargando el neto en Cargar.</p>
  </div>`;
}
function dibujarTodo(){
  recalcular();dibujarSelector();dibujarCabecera();dibujarRecibo();dibujarCargar();dibujarMeses();dibujarAumentos();
}
function refrescarSalidas(){recalcular();dibujarCabecera();dibujarRecibo();dibujarMeses();refrescarCargar()}
function escribiendoAca(sel){const a=document.activeElement;return a&&a.closest&&a.closest(sel)&&/INPUT|SELECT/.test(a.tagName)}

/* ---------- pestañas ---------- */
function irTab(t,hash=true){
  if(!["recibo","cargar","meses","aumentos"].includes(t))t="recibo";
  S.tab=t;document.body.dataset.tab=t;
  $$("#tabs button").forEach(b=>{if(b.dataset.tab===t)b.setAttribute("aria-current","page");else b.removeAttribute("aria-current")});
  if(hash&&location.hash.slice(1)!==t){try{location.hash=t}catch(e){}}
  window.scrollTo(0,0);
}
function irMes(id){if(!id||id===S.mes)return;S.mes=id;dibujarSelector();dibujarCabecera();dibujarRecibo();dibujarCargar();dibujarMeses()}
let toastT=null,deshacer=null;
function avisar(txt,fn){
  const t=$("#toast");deshacer=fn||null;
  t.innerHTML=`<span>${esc(txt)}</span>${fn?'<button type="button" id="deshacer">Deshacer</button>':""}`;
  t.classList.add("ver");clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove("ver"),fn?7000:2600);
}

/* ---------- eventos ---------- */
function mesDoc(){return S.meses[S.mes]||(S.meses[S.mes]={})}
function fijar(k,valorTxt){
  const d=mesDoc(),n=aNum(valorTxt);
  if(valorTxt.trim()===""||!Number.isFinite(n))delete d[k];else d[k]=n;
  guardarMes(S.mes);refrescarSalidas();
}
document.addEventListener("input",e=>{
  const t=e.target;
  if(t.dataset.f){fijar(t.dataset.f,t.value);return}
  if(t.dataset.d){
    const d=mesDoc();d.dias=d.dias||{};const f=d.dias[t.dataset.d]||(d.dias[t.dataset.d]={}),n=aNum(t.value);
    if(t.value.trim()===""||!Number.isFinite(n))delete f[t.dataset.k];else f[t.dataset.k]=n;
    if(!Object.keys(f).length)delete d.dias[t.dataset.d];
    guardarMes(S.mes);refrescarSalidas();
  }
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.id==="mes"){irMes(t.value);return}
  if(t.id==="copia-archivo"){const a=t.files&&t.files[0];t.value="";if(a)recuperarCopia(a);return}
  if(t.dataset.t){const d=mesDoc();d[t.dataset.t]=t.value;guardarMes(S.mes);dibujarTodo();return}
  if(t.dataset.n){const d=mesDoc();if(t.value==="")delete d[t.dataset.n];else d[t.dataset.n]=Number(t.value);guardarMes(S.mes);refrescarSalidas();return}
  if(t.dataset.pa){
    const pf=S.perfil;pf.pauta=pf.pauta||{};const o=pf.pauta[t.dataset.pa]||(pf.pauta[t.dataset.pa]={}),k=t.dataset.pk;
    if(k==="tabla")o.tabla=t.value;
    else{const n=aNum(t.value===""?"0":t.value);if(Number.isFinite(n))o[k]=n}
    guardarPerfil();recalcular();dibujarCabecera();dibujarRecibo();dibujarMeses();if(k==="tabla")dibujarCargar();return;
  }
  if(t.dataset.ot){
    const pf=S.perfil;pf.ov=pf.ov||{};const o=pf.ov[t.dataset.ot]||(pf.ov[t.dataset.ot]={}),n=aNum(t.value);
    if(Number.isFinite(n))o[t.dataset.ok]=n;
    guardarPerfil();dibujarTodo();return;
  }
  if(t.dataset.par){
    const n=aNum(t.value);if(Number.isFinite(n)){S.perfil.params=S.perfil.params||{};S.perfil.params[t.dataset.par]=n/100;guardarPerfil();refrescarSalidas()}
    return;
  }
  if(t.id==="par-ing"){S.perfil.ingreso=t.value;guardarPerfil();refrescarSalidas();return}
  if(t.id==="par-zona"){S.perfil.zonaId=t.value;guardarPerfil();dibujarTodo()}
});
document.addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  if(b.dataset.tab){irTab(b.dataset.tab);return}
  if(b.id==="prev"||b.id==="next"){
    const i=S.lista.findIndex(x=>x.id===S.mes)+(b.id==="prev"?-1:1);
    if(S.lista[i])irMes(S.lista[i].id);return;
  }
  if(b.dataset.irTab){irTab(b.dataset.irTab);return}
  if(b.dataset.irMes){irMes(b.dataset.irMes);irTab("recibo");return}
  if(b.dataset.paso){
    const inp=document.getElementById(b.dataset.for),act=aNum(inp.value||"0")||0,nv=Math.max(0,act+Number(b.dataset.paso));
    inp.value=nv?String(nv).replace(".",","):"";fijar(inp.dataset.f,inp.value);return;
  }
  if(b.dataset.modo){
    const d=mesDoc();d.modo=b.dataset.modo;
    if(d.modo==="tot")for(const c of PLANILLA){const s=sumaDias(d,c.k);if(s)d[c.k]=s}
    guardarMes(S.mes);refrescarSalidas();dibujarCargar();return;
  }
  if(b.id==="copiar"){
    const de=$("#copiar-de").value,orig=clon(S.meses[S.mes]||{}),d=mesDoc(),f=S.meses[de]||{};
    for(const c of PLANILLA){const v=cantidad(f,c.k);if(v)d[c.k]=v;else delete d[c.k]}
    for(const k of ["mf","gr","fr"]){if(f[k])d[k]=f[k];else delete d[k]}
    delete d.modo;guardarMes(S.mes);dibujarTodo();
    const id=S.mes;avisar(`Copié las cantidades de ${de}.`,()=>{S.meses[id]=orig;guardarMes(id);dibujarTodo()});return;
  }
  if(b.id==="copia-guardar"){guardarCopia();return}
  if(b.id==="copia-recuperar"){$("#copia-archivo").click();return}
  if(b.id==="instalar"){if(pedidoInstalar){pedidoInstalar.prompt();pedidoInstalar=null}return}
  if(b.id==="deshacer"){if(deshacer)deshacer();deshacer=null;$("#toast").classList.remove("ver");return}
  if(b.id==="ini-ok"){
    const ing=$("#ini-ing").value,cat=$("#ini-cat").value,sig=DATOS.cats[DATOS.cats.indexOf(cat)+4]||cat;
    if(!ing){avisar("Falta la fecha de ingreso.");return}
    S.perfil.ingreso=ing;S.perfil.cat=cat;S.perfil.catmf=sig;S.perfil.zonaId=$("#ini-zona").value;
    if($("#ini-mut").value==="no")S.perfil.params=Object.assign({},S.perfil.params,{mut:0});
    guardarPerfil();dibujarTodo();return;
  }
  if(b.id==="nu-ok"){
    const nom=$("#nu-nom").value.trim(),pct=aNum($("#nu-pct").value),des=$("#nu-des").value,ts=tablasDe(S.perfil);
    if(!nom||ts.includes(nom)){avisar(nom?"Ya hay una tabla con ese nombre.":"Ponele un nombre al aumento.");return}
    if(!Number.isFinite(pct)){avisar("Falta el % de aumento.");return}
    const pf=S.perfil,prev=mesPrevio(des),base=prev?S.res[prev].tabla:DATOS.tablas[0];
    pf.tablas=(pf.tablas||[]).concat([{id:nom,base,pct:pct/100}]);pf.pauta=pf.pauta||{};
    let on=false;for(const m of S.lista){if(m.id===des)on=true;if(on)(pf.pauta[m.id]=pf.pauta[m.id]||{}).tabla=nom}
    guardarPerfil();dibujarTodo();avisar(`Agregué ${nom}. Rige desde ${des}.`);return;
  }
  if(b.dataset.quitar){
    const id=b.dataset.quitar,pf=S.perfil,orig=clon(pf);
    pf.tablas=(pf.tablas||[]).filter(t=>t.id!==id);
    for(const m in pf.pauta||{}){if(pf.pauta[m].tabla===id)delete pf.pauta[m].tabla}
    if(pf.ov)delete pf.ov[id];
    guardarPerfil();dibujarTodo();avisar(`Quité ${id}.`,()=>{S.perfil=orig;guardarPerfil();dibujarTodo()});
  }
});
window.addEventListener("hashchange",()=>irTab(location.hash.slice(1),false));

/* ---------- arranque ---------- */
function iniciar(){
  S.mes=mesInicial();irTab(location.hash.slice(1)||"recibo",false);S.cargado=true;
  const l=leerLocal();if(l){S.perfil=l.perfil||{};S.meses=l.meses||{}}
  let ok=true;try{localStorage.setItem(CLAVE_LOCAL+"-t","1");localStorage.removeItem(CLAVE_LOCAL+"-t")}catch(e){ok=false}
  if(!ok)$("#aviso").innerHTML="<p>Este navegador no permite guardar datos. Podés calcular igual, pero lo que cargues se pierde al cerrar.</p>";
  dibujarTodo();
  if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
}
iniciar();
</script>
</body>
</html>
